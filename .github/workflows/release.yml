name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and Attest Installer
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Validate tag format and version consistency
        if: github.ref_type == 'tag'
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: node scripts/validateReleaseVersion.js

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build Windows NSIS installer
        run: npm run build:installer

      - name: Verify installer artifact and generate SHA-256 checksums
        shell: pwsh
        run: |
          $pkgJson = Get-Content package.json -Raw | ConvertFrom-Json
          $expectedVersion = $pkgJson.version
          $expectedInstallerName = "Pergamum.Setup.$expectedVersion.exe"

          $installerFiles = Get-ChildItem -Path dist-installer -Filter *.exe
          if ($installerFiles.Count -ne 1) {
            Write-Error "Expected exactly 1 .exe installer in dist-installer, but found $($installerFiles.Count)."
            exit 1
          }

          $installer = $installerFiles[0]
          if ($installer.Name -ne $expectedInstallerName) {
            Write-Error "Installer filename mismatch: expected '$expectedInstallerName', but found '$($installer.Name)'."
            exit 1
          }

          Write-Host "Verified installer artifact: $($installer.Name)"

          $hash = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLower()
          $checksumLine = "$hash  $($installer.Name)"
          $checksumPath = "dist-installer/SHA256SUMS.txt"
          $checksumLine | Set-Content -Path $checksumPath -Encoding utf8
          Write-Host "Generated SHA256SUMS.txt:"
          Get-Content $checksumPath

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: "dist-installer/*.exe"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pergamum-release-assets
          path: |
            dist-installer/*.exe
            dist-installer/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: pergamum-release-assets
          path: release-assets

      - name: Publish Release safely
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          echo "Checking release status for tag: $TAG via GitHub REST API..."

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG") || HTTP_STATUS="000"

          echo "GitHub REST API returned HTTP status: $HTTP_STATUS"

          case "$HTTP_STATUS" in
            200)
              echo "::error::Release for tag $TAG already exists (HTTP 200). Aborting to prevent overwriting or unintended modification."
              exit 1
              ;;
            404)
              echo "Confirmed that no release exists for tag $TAG (HTTP 404). Proceeding with publication."
              ;;
            000)
              echo "::error::Network error: Failed to communicate with GitHub API to verify release status (HTTP 000). Aborting (fail-closed)."
              exit 1
              ;;
            *)
              echo "::error::GitHub API returned unexpected status code '$HTTP_STATUS' while checking release for tag $TAG. Aborting (fail-closed)."
              exit 1
              ;;
          esac

          echo "Creating and publishing release for $TAG..."
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --prerelease
